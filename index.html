        // --- HOOK ĐẾM SỐ TỰ ĐỘNG CHẠY TỪ 0 ---
        function useCountUp(endValue, duration = 1000, trigger = true) {
            const [count, setCount] = useState(0);
            useEffect(() => {
                if (!trigger) {
                    setCount(0);
                    return;
                }
                setCount(0);
                let startTimestamp = null;
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    setCount(Math.floor(progress * endValue));
                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    } else {
                        setCount(endValue);
                    }
                };
                window.requestAnimationFrame(step);
            }, [endValue, duration, trigger]);
            return count;
        }

                                <span className="px-3 py-1 bg-emerald-100 text-emerald-800 font-bold text-xs rounded-full">

                    </div>

                    <div className={activeTab === "market" ? "space-y-8 mt-6" : "hidden print:block space-y-8"}>
                        
                        {/* --- TRANG 4: Bản đồ, Biểu đồ & Các nút thống kê tiến trình --- */}
                        <div className="print-page-4 space-y-8">
                            {/* Link Google My Map */}

                                    <div className="w-10 h-10 rounded-lg bg-white/20 flex items-center justify-center font-bold text-lg">🗺️</div>
                                    <div>
                                        <h4 className="font-bold text-base">Bản đồ trực quan Khách hàng quanh KCN Cái Mép</h4>
                                        <p className="text-xs text-sky-100">Truy cập Google My Map để xem vị trí chi tiết và lộ trình tuyến đường.</p>
                                    </div>
                                </div>
                                <a 
                                    href="https://www.google.com/maps/d/viewer?hl=vi&mid=1lsFEs0iI9Cyg8qnvewzJ79g7o1XWktI&ll=10.582220761656924%2C107.06280695562646&z=13" 
                                    target="_blank" 
                                    rel="noopener noreferrer"
                                    className="px-4 py-2 bg-white text-blue-700 font-bold text-xs rounded-lg hover:bg-sky-50 transition-colors shadow whitespace-nowrap"
                                >
                                    Mở Google My Map ↗
                                </a>
                            </div>

                            {/* Biểu đồ tròn (Pie Chart) với key động đảm bảo animation quay luôn kích hoạt */}

                                <h4 className="font-bold text-slate-800 text-base mb-4 text-center">Biểu đồ tỷ trọng phân bổ tiến trình thị trường</h4>

                                    {(activeTab === "market" || isPrinting) && showMarketChart && (
                                        <ResponsiveContainer key={`res-container-${chartKey}`} width="100%" height={280}>
                                            <PieChart key={`pie-chart-${chartKey}`} margin={{ top: 20, right: 70, left: 70, bottom: 20 }}>
                                                <Pie
                                                    key={`pie-${chartKey}`}
                                                    data={pieChartData}
                                                    cx="50%"
                                                    cy="50%"
                                                    labelLine={true}
                                                    outerRadius={80}
                                                    fill="#8884d8"
                                                    dataKey="value"
                                                    isAnimationActive={true}
                                                    animationBegin={0}
                                                    animationDuration={1500}

                                        </ResponsiveContainer>

                            </div>

                                <button

                                            ? "bg-gradient-to-br from-emerald-600 to-teal-700 text-white ring-2 ring-emerald-400 shadow-xl border-transparent scale-[1.01]"
                                            : "bg-gradient-to-br from-slate-900 via-emerald-950 to-teal-950 text-white hover:opacity-95 border-emerald-800/60"

                                    <div className="flex items-center justify-between mb-2">
                                        <span className="text-xs font-bold uppercase tracking-wider text-emerald-200 flex items-center gap-1.5">

                                        </span>
                                    </div>
                                    <div className="flex items-baseline justify-between mt-auto pt-2 border-t border-white/15">
                                        <span className="text-3xl font-black text-white">
                                            {totalMarketCount}
                                        </span>
                                        <span className="text-[11px] font-bold bg-white/20 px-2.5 py-0.5 rounded-full text-white">Tất cả KH</span>
                                    </div>
                                </button>

                                {REPORT_DATA.marketPromotion.map((item) => {
                                    const isSelected = selectedPromotion === item.id;
                                    return (
                                        <button
                                            key={item.id}
                                            onClick={() => setSelectedPromotion(item.id)}
                                            className={`p-3 rounded-xl border text-left transition-all relative flex flex-col justify-between h-full cursor-pointer ${
                                                isSelected
                                                    ? `ring-2 ring-emerald-600 shadow-md text-white border-transparent`
                                                    : "bg-white border-emerald-200 hover:bg-emerald-100/60 text-slate-700"
                                            }`}
                                            style={{ backgroundColor: isSelected ? item.color : undefined }}
                                        >
                                            <span className={`text-xs font-semibold leading-tight block mb-2 ${isSelected ? "text-white/90" : "text-slate-700"}`}>
                                                {item.label}
                                            </span>
                                            <div className="flex items-baseline justify-between mt-auto pt-2 border-t border-black/5">
                                                <span className={`text-2xl font-black ${isSelected ? "text-white" : "text-slate-900"}`}>
                                                    {item.count}
                                                </span>
                                            </div>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="print-page-4-details space-y-8">

                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b border-emerald-200 pb-5">
                                    <div>
                                        <span className="px-3 py-1 bg-emerald-600 text-white font-bold text-xs rounded-full inline-block mb-2">

                                    </div>
                                </div>

                                <div className="bg-white rounded-xl p-5 border border-emerald-200 shadow-inner">
                                    {selectedPromotion === "all" ? (

                                                    Tổng số: {totalMarketCount} công ty
                                                </span>
                                            </div>
                                            {REPORT_DATA.marketPromotion.map((promo, pIdx) => (
                                                <div key={pIdx} className="bg-slate-50/70 rounded-xl p-4 border border-slate-200 shadow-sm print-compact-section">
                                                    <div className="flex items-center gap-2 mb-3 pb-2 border-b border-slate-200">
                                                        <span className="w-3 h-3 rounded-full" style={{ backgroundColor: promo.color }}></span>
                                                        <h5 className="font-bold text-slate-800 text-sm">{promo.label}</h5>
                                                        <span className="ml-auto text-xs font-bold bg-white px-2 py-0.5 rounded border border-slate-200 text-slate-600">{promo.count} công ty</span>
                                                    </div>
                                                    {promo.companies.length > 0 ? (
                                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 print-compact-grid">
                                                            {promo.companies.map((comp, cIdx) => (
                                                                <div key={cIdx} className="bg-white p-3.5 rounded-xl border border-slate-200 text-sm flex flex-col justify-between gap-2 shadow-sm print-compact-card">
                                                                    <div className="flex items-start gap-2 font-semibold text-slate-800">
                                                                        <span className="w-5 h-5 rounded-full bg-emerald-50 text-emerald-700 font-bold text-[10px] flex items-center justify-center flex-shrink-0 mt-0.5 border border-emerald-200">
                                                                            {cIdx + 1}
                                                                        </span>
                                                                        <span className="leading-snug">{comp.name}</span>
                                                                    </div>
                                                                    <div className="flex justify-end gap-1.5 pt-2 border-t border-slate-100 mt-auto">
                                                                        {comp.note && <span className={`text-[11px] font-semibold px-2 py-0.5 rounded border ${getNoteBadgeStyle(comp.note)}`}>{comp.note}</span>}
                                                                        <span className={`text-[11px] font-semibold px-2 py-0.5 rounded border ${getKcnBadgeStyle(comp.kcn)}`}>{comp.kcn}</span>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>

                                                        <p className="text-xs text-slate-400 italic">Không có công ty nào.</p>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div>
                                            <div className="flex justify-between items-center mb-4 pb-3 border-b border-slate-200">
                                                <div className="flex items-center gap-2">
                                                    <span className="w-3 h-3 rounded-full" style={{ backgroundColor: activePromoObj.color }}></span>
                                                    <h4 className="font-bold text-slate-800 text-sm">{activePromoObj.label}</h4>
                                                </div>
                                                <span className="text-xs font-bold bg-emerald-50 px-2.5 py-1 rounded-md border border-emerald-200 text-emerald-800">
                                                    Số lượng: {activePromoObj.count} công ty
                                                </span>
                                            </div>
                                            
                                            {activePromoObj.companies.length > 0 ? (
                                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 items-stretch print-compact-grid">
                                                    {activePromoObj.companies.map((comp, cIdx) => (
                                                        <div 
                                                            key={cIdx} 
                                                            className="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between gap-3 hover:border-emerald-400 hover:shadow transition-all h-full print-compact-card"
                                                        >
                                                            <div className="flex items-start gap-3 font-medium text-sm text-slate-700">
                                                                <span className="w-6 h-6 rounded-full bg-emerald-50 text-emerald-700 font-bold text-xs flex items-center justify-center flex-shrink-0 mt-0.5 border border-emerald-200">
                                                                    {cIdx + 1}
                                                                </span>
                                                                <span className="leading-snug break-words flex-1 font-semibold text-slate-800">{comp.name}</span>
                                                            </div>
                                                            <div className="flex flex-wrap items-center justify-end gap-1.5 pt-2 border-t border-slate-100 mt-auto">
                                                                {comp.note && (
                                                                    <span className={`text-[11px] font-semibold px-2 py-0.5 rounded border ${getNoteBadgeStyle(comp.note)}`}>
                                                                        {comp.note}
                                                                    </span>
                                                                )}
                                                                <span className={`text-[11px] font-semibold px-2 py-0.5 rounded border ${getKcnBadgeStyle(comp.kcn)}`}>
                                                                    {comp.kcn}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            ) : (
                                                <div className="py-8 text-center text-slate-400 text-sm">
                                                    Không có công ty nào thuộc nhóm tiến trình này.
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Kế hoạch tuần tới */}

                                    </div>
                                </div>

                                <div className="bg-white rounded-xl border border-sky-200 p-4 shadow-inner">

                                            const isNew = comp.type.includes("Mới");
                                            return (
                                                <div 
                                                    key={comp.stt} 
                                                    onClick={() => setModalData({
                                                        type: 'plan',
                                                        title: comp.name,
                                                        p25: comp.p25,
                                                        p26: comp.p26

                                                    <div className="flex items-start gap-3 font-medium text-sm text-slate-700">
                                                        <span className="w-6 h-6 rounded-full bg-sky-50 text-sky-700 font-bold text-xs flex items-center justify-center flex-shrink-0 mt-0.5 border border-sky-200">
                                                            {comp.stt}
                                                        </span>
                                                        <span className="leading-snug break-words flex-1 font-semibold text-slate-800">{comp.name}</span>
                                                    </div>
                                                    <div className="flex flex-wrap items-center justify-end gap-1.5 pt-2 border-t border-slate-100 mt-auto">
                                                        <span className={`text-[11px] font-semibold px-2 py-0.5 rounded border ${
                                                            isNew 
                                                                ? "bg-sky-50 text-sky-700 border-sky-200" 
                                                                : "bg-amber-50 text-amber-700 border-amber-200"
                                                        }`}>
                                                            {comp.type}
                                                        </span>
                                                        <span className={`text-[11px] font-semibold px-2 py-0.5 rounded border ${getKcnBadgeStyle(comp.kcn)}`}>
                                                            {comp.kcn}
                                                        </span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                    {/* MODAL POPUP */}
                    {modalData && (
                        <div 
                            className="print:hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 transition-opacity duration-300"
                            onClick={() => setModalData(null)}
                        >
                            <div 
                                className="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-slate-200 transform transition-all"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="flex justify-between items-center pb-3 border-b border-slate-100 mb-4">
                                    <div>
                                        <h3 className="font-bold text-slate-800 text-base leading-snug">{modalData.title}</h3>
                                        {modalData.subtitle && <p className="text-xs text-blue-600 font-semibold mt-0.5">{modalData.subtitle}</p>}
                                    </div>
                                    <button 
                                        onClick={() => setModalData(null)}
                                        className="text-slate-400 hover:text-slate-600 font-bold text-lg p-1"
                                    >&times;</button>
                                </div>

                                {modalData.type === 'volume' && (
                                    <div className="overflow-x-auto mb-5">
                                        <table className="w-full text-left border-collapse text-sm">
                                            <thead>
                                                <tr className="border-b border-slate-200 text-slate-500 uppercase text-xs bg-slate-50">
                                                    <th className="py-2.5 px-3 font-semibold">Kích cỡ container</th>
                                                    <th className="py-2.5 px-3 font-semibold text-right">Số lượng (Cont)</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 font-medium text-slate-700">
                                                {Object.entries(modalData.sizes).map(([size, val], sIdx) => (
                                                    <tr key={sIdx} className="hover:bg-slate-50">
                                                        <td className="py-2.5 px-3">{size}</td>
                                                        <td className="py-2.5 px-3 text-right font-bold text-blue-600">
                                                            {typeof val === 'number' ? val.toLocaleString() : val}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}

                                {modalData.type === 'plan' && (
                                    <div className="overflow-x-auto mb-5">
                                        <p className="text-xs text-slate-500 mb-3 font-medium">Thống kê sản lượng GNTT qua TCIT theo năm:</p>
                                        <table className="w-full text-left border-collapse text-sm">
                                            <thead>
                                                <tr className="border-b border-slate-200 text-slate-500 uppercase text-xs bg-slate-50">
                                                    <th className="py-2.5 px-3 font-semibold">Năm</th>
                                                    <th className="py-2.5 px-3 font-semibold text-center">Cont</th>
                                                    <th className="py-2.5 px-3 font-semibold text-right">TEU</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 font-medium text-slate-700">
                                                <tr className="hover:bg-slate-50">
                                                    <td className="py-2.5 px-3 font-bold text-slate-800">2025</td>
                                                    <td className="py-2.5 px-3 text-center font-semibold text-blue-600">
                                                        {modalData.p25 ? `${modalData.p25.cont} conts` : '-'}
                                                    </td>
                                                    <td className="py-2.5 px-3 text-right font-semibold text-emerald-600">
                                                        {modalData.p25 ? `${modalData.p25.teu} teus` : '-'}
                                                    </td>
                                                </tr>
                                                <tr className="hover:bg-slate-50">
                                                    <td className="py-2.5 px-3 font-bold text-slate-800">2026</td>
                                                    <td className="py-2.5 px-3 text-center font-semibold text-blue-600">
                                                        {modalData.p26 ? `${modalData.p26.cont} conts` : '-'}
                                                    </td>
                                                    <td className="py-2.5 px-3 text-right font-semibold text-emerald-600">
                                                        {modalData.p26 ? `${modalData.p26.teu} teus` : '-'}
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                )}

                                <div className="mt-4 flex justify-end">
                                    <button 
                                        onClick={() => setModalData(null)}
                                        className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-lg shadow transition-all"
                                    >
                                        Đóng
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        ReactDOM.render(<DashboardWeek30 />, rootElement);
    </script>
</body>
</html>
